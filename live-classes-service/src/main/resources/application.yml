server:
  port: ${SERVER_PORT:8095}

spring:
  application:
    name: live-classes-service
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connectTimeout: 3000
            readTimeout: 5000

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
    instances:
      enrollmentClient:
        baseConfig: default
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 1s
        ignoreExceptions:
          - feign.FeignException.BadRequest
          - feign.FeignException.Unauthorized
    instances:
      enrollmentClient:
        baseConfig: default

dynamodb:
  region: ${AWS_REGION}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET}

videosdk:
  api:
    key: ${VIDEOSDK_API_KEY}
    secret: ${VIDEOSDK_API_SECRET}
    endpoint: ${VIDEOSDK_API_ENDPOINT:https://api.videosdk.live/v2}

aws:
  s3:
    bucket: ${S3_BUCKET_NAME}
    region: ${AWS_REGION}
    accessKey: ${AWS_ACCESS_KEY_ID}
    secretKey: ${AWS_SECRET_ACCESS_KEY}
